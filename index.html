<!DOCTYPE html>
<!-- made by lydson -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadoras financeiras</title>
<meta name="description" content="Calculadoras financeiras para pessoa física: juros compostos, renda fixa, reserva de emergência, financiamento, consórcio e mais.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Inter+Tight:wght@400..900&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400..800&display=swap">
<style>
/* made by lydson */
:root{
  color-scheme:light;
  --bg:#ffffff; --bg-soft:#f6f7f9; --panel:#f1f2f5; --card:#ffffff;
  --border:#e4e7ec; --border-hover:#cdd2d9;
  --ink:#0b0d10; --ink-soft:#3d4450; --muted:#5b6370;
  --accent:#f5d90a; --accent-hover:#e8cb00; --accent-text:#7a6100; --on-accent:#0b0d10; --accent-soft:#fdf8d4; --line:#0b0d10;
  --mark:#f5d90a; --on-mark:#0b0d10;
  --warn-soft:#fef6e9; --warn-line:rgba(160,74,6,.35);
  --s1:#b8860b; --s2:#a1a1aa;
  --invert-bg:#0b0d10; --invert-ink:#ffffff; --invert-soft:#9aa3af;
  --header-bg:rgba(255,255,255,.85);
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-pop:0 12px 32px -12px rgba(16,24,40,.25);
  --f-sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Inter Tight','Inter',ui-sans-serif,system-ui,sans-serif;
  --f-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:6px; --r:10px; --r-card:14px;
  --dur-fast:.12s; --dur:.2s; --dur-slow:.28s; --ease:cubic-bezier(.2,.8,.2,1);
  --header-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b0d10; --bg-soft:#111419; --panel:#171b21; --card:#111419;
    --border:#262b33; --border-hover:#3a414b;
    --ink:#e6e8eb; --ink-soft:#c3c8cf; --muted:#9aa3af;
    --accent:#f5d90a; --accent-hover:#fff06b; --accent-text:#f5d90a; --on-accent:#0b0d10; --accent-soft:#29250a; --line:#f5d90a;
    --warn-soft:#231a0e; --warn-line:rgba(245,158,11,.35);
    --s1:#f5d90a; --s2:#5b6370;
    --invert-bg:#f6f7f9; --invert-ink:#0b0d10; --invert-soft:#5b6370;
    --header-bg:rgba(11,13,16,.85);
    --shadow-pop:0 12px 32px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0d10; --bg-soft:#111419; --panel:#171b21; --card:#111419;
  --border:#262b33; --border-hover:#3a414b;
  --ink:#e6e8eb; --ink-soft:#c3c8cf; --muted:#9aa3af;
  --accent:#f5d90a; --accent-hover:#fff06b; --accent-text:#f5d90a; --on-accent:#0b0d10; --accent-soft:#29250a; --line:#f5d90a;
  --warn-soft:#231a0e; --warn-line:rgba(245,158,11,.35);
  --s1:#f5d90a; --s2:#5b6370;
  --invert-bg:#f6f7f9; --invert-ink:#0b0d10; --invert-soft:#5b6370;
  --header-bg:rgba(11,13,16,.85);
  --shadow-pop:0 12px 32px -12px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:140px}
body{font-family:var(--f-sans);font-size:16px;line-height:1.5;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;transition:background var(--dur) ,color var(--dur)}
button,input,select{font:inherit;color:inherit}
::selection{background:#f5d90a;color:#0b0d10}
:focus-visible{outline:2px solid var(--line);outline-offset:2px;border-radius:4px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);text-decoration:none;font-weight:600;transition:top var(--dur)}
.skip:focus{top:12px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--header-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.bar{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:var(--f-mono);font-weight:800;font-size:17px;letter-spacing:-.025em;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo .cur{color:var(--accent-text);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--border);background:var(--card);cursor:pointer;transition:border-color var(--dur-fast),background var(--dur-fast)}
.icon-btn:hover{border-color:var(--border-hover);background:var(--bg-soft)}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .icon-btn .sun{display:block}:root:not([data-theme="light"]) .icon-btn .moon{display:none}}

/* ---------- menu ---------- */
.menu-wrap{position:relative;border-top:1px solid var(--border)}
.menu-wrap::before,.menu-wrap::after{content:"";position:absolute;top:0;bottom:0;width:24px;pointer-events:none;z-index:2;opacity:0;transition:opacity var(--dur)}
.menu-wrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.menu-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.menu-wrap.fade-l::before,.menu-wrap.fade-r::after{opacity:1}
.menu{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px 0;scroll-behavior:smooth}
.menu::-webkit-scrollbar{display:none}
.menu button{position:relative;z-index:1;flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-soft);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color var(--dur-fast)}
.menu button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);transition:color var(--dur-fast)}
.menu button:hover{color:var(--ink)}
.menu button[aria-selected="true"]{color:var(--on-accent)}
.menu button[aria-selected="true"] .n{color:var(--on-accent);opacity:.75}
.pill{position:absolute;z-index:0;top:8px;height:36px;border-radius:var(--r-sm);background:var(--accent);transition:transform var(--dur-slow) var(--ease),width var(--dur-slow) var(--ease)}

/* ---------- page head ---------- */
main{flex:1;padding:48px 0 80px}
.head{margin-bottom:36px;max-width:900px}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;background:var(--mark);color:var(--on-mark);padding:6px 12px}
.head .lead{display:block;font-family:var(--f-serif);font-style:italic;font-size:clamp(26px,3.4vw,36px);line-height:1.2;color:var(--ink-soft);margin-top:22px}
.head h1{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,8.6vw,80px);letter-spacing:-.035em;line-height:.95;margin-top:4px}
.head h1 .ln{display:block;overflow:hidden;padding-bottom:.04em}
.head h1 .ln>span{display:inline-block}
.head h1 .hl{background:var(--accent);color:var(--on-accent);padding:0 .08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.head p{font-size:18px;line-height:1.6;color:var(--ink-soft);margin-top:18px;max-width:620px}
.enter .ln>span{animation:rise .6s var(--ease) both}
.enter .ln:nth-child(2)>span{animation-delay:.06s}
.enter .ln:nth-child(3)>span{animation-delay:.12s}
.enter .lead,.enter p,.enter .badge{animation:fade .5s var(--ease) both}
.enter .body{animation:fade .5s .1s var(--ease) both}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- layout ---------- */
.body{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1020px){.body{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card)}

/* ---------- form ---------- */
.form{padding:20px;display:flex;flex-direction:column;gap:20px}
@media (min-width:1021px){.form{position:sticky;top:150px}}
.form-title{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.field label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px}
.inp{display:flex;align-items:center;height:46px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:0 12px;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.inp:hover{border-color:var(--border-hover)}
.inp:focus-within{border-color:var(--line);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}
.inp .ad{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.inp input,.inp select{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;padding:0 8px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.inp select{cursor:pointer;padding-left:0}
.inp select option{background:var(--card);color:var(--ink)}
.inp .unit-sel{flex:none;height:auto;padding:0;font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:20px;background:transparent;margin-top:6px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--line) var(--p,50%),var(--border) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--border)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--accent);border:2px solid var(--line);box-shadow:var(--shadow-xs);transition:transform var(--dur-fast)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--line)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]:focus-visible{outline:none}
.seg{display:flex;gap:4px;background:var(--panel);border-radius:var(--r);padding:4px}
.seg button{flex:1;height:38px;border:0;border-radius:var(--r-sm);background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);transition:background var(--dur-fast),color var(--dur-fast),box-shadow var(--dur-fast)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-xs),0 0 0 1px var(--border)}

/* ---------- results ---------- */
.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{padding:16px 18px;min-width:0;transition:border-color var(--dur-fast)}
.kpi:hover{border-color:var(--border-hover)}
.kpi .l{font-size:13px;color:var(--muted);line-height:1.4}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,1.9vw,24px);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.main{grid-column:1/-1;background:var(--invert-bg);border-color:var(--invert-bg);color:var(--invert-ink);padding:22px 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.kpi.main .l{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--invert-soft)}
.kpi.main .v{font-weight:800;font-size:clamp(34px,5vw,56px);letter-spacing:-.035em;line-height:1;margin-top:10px;white-space:normal}
.kpi.main .s{color:var(--invert-soft);font-size:13px}
.kpi .v.tick{animation:tick var(--dur-slow) var(--ease)}
@keyframes tick{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}

.box{padding:20px;min-width:0;position:relative}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.box-h h2{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.legend i.dash{width:14px;height:0;border-top:2px dashed var(--ink);border-radius:0;vertical-align:3px}

.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart .grid line{stroke:var(--border)}
.chart .axis text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .guide{stroke:var(--ink);stroke-dasharray:3 3;opacity:0;transition:opacity var(--dur-fast)}
.chart .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .ln.anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .ref{stroke:var(--ink);stroke-dasharray:5 5;stroke-width:1.2;opacity:.6}
.chart .ref-t{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--f-mono)}
.tip{position:absolute;pointer-events:none;background:var(--invert-bg);color:var(--invert-ink);border-radius:var(--r);padding:10px 12px;font-size:12px;min-width:170px;opacity:0;transform:translateY(4px);transition:opacity var(--dur-fast),transform var(--dur-fast);z-index:5;box-shadow:var(--shadow-pop)}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;color:var(--invert-soft)}
.tip div{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.bars{display:flex;flex-direction:column;gap:14px}
.bar .bl{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;margin-bottom:6px}
.bar .bl b{font-variant-numeric:tabular-nums;font-weight:600}
.bar .tr{height:32px;border-radius:var(--r-sm);background:var(--bg-soft);overflow:hidden}
.bar .fl{height:100%;width:0;border-radius:var(--r-sm);background:var(--s2);transition:width .8s var(--ease);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-family:var(--f-mono);font-size:12px;font-weight:700;color:#0b0d10}
.bar.best .fl{background:var(--accent);color:var(--on-accent)}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--mark);color:var(--on-mark);padding:3px 7px;margin-left:8px}

.progress{display:flex;align-items:center;gap:20px}
.ring{width:104px;height:104px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--panel)}
.ring .fg{stroke:var(--s1);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s var(--ease)}
.ring text{font-family:var(--f-display);font-weight:800;font-size:22px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.progress h3{font-family:var(--f-display);font-size:18px;font-weight:700;margin-bottom:4px}
.progress p{color:var(--ink-soft);font-size:14px}

.note{font-size:14px;line-height:1.6;color:var(--ink-soft);background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-card);padding:14px 18px}
.note.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--ink)}
.note strong{color:var(--ink)}

details.more{border:1px solid var(--border);border-radius:var(--r-card);background:var(--card);overflow:hidden}
details.more summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:600;font-size:15px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted);transition:transform var(--dur)}
details.more[open] summary::after{transform:rotate(45deg)}
.tbl-wrap{overflow:auto;max-height:320px;border-top:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--bg-soft);text-align:right;font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border)}
td{text-align:right;padding:9px 14px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--border);padding:28px 0 36px;text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
footer .disclaimer{font-family:var(--f-sans);font-size:13px;line-height:1.6;max-width:620px;margin:0 auto 12px;color:var(--muted)}
footer .disclaimer a{color:var(--ink);text-underline-offset:3px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para a calculadora</a>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#" aria-label="Calculadoras financeiras, início">Calculadoras financeiras<span class="cur" aria-hidden="true">_</span></a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema claro ou escuro">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="menu-wrap" id="menuWrap">
    <nav class="wrap menu" id="menu" role="tablist" aria-label="Calculadoras"><span class="pill" id="pill" aria-hidden="true"></span></nav>
  </div>
</header>

<main id="conteudo" tabindex="-1">
  <div class="wrap" id="view" role="tabpanel"></div>
</main>

<footer>
  <div class="wrap">
    <p class="disclaimer">As simulações são estimativas e não são recomendação de investimento. Encontrou algum erro? <a href="https://github.com/Lydson/calculadoras-financeiras/issues">Me avise por aqui</a>.</p>
    <span>made by lydson</span>
  </div>
</footer>

<div class="sr-only" aria-live="polite" id="live"></div>

<script>
/* made by lydson */
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const brl = (v, d = 2) => (isFinite(v) ? v : 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', minimumFractionDigits:d, maximumFractionDigits:d});
const brl0 = v => brl(v, 0);
const num = (v, d = 2) => v.toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = (v, d = 2) => num(v, d) + '%';
const compact = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return 'R$ ' + num(v/1e6, a >= 1e7 ? 0 : 1) + ' mi';
  if (a >= 1e3) return 'R$ ' + num(v/1e3, 0) + ' mil';
  return 'R$ ' + num(v, 0);
};
const mRate = a => Math.pow(1 + a/100, 1/12) - 1;           // taxa anual efetiva -> mensal
const yRate = m => (Math.pow(1 + m/100, 12) - 1) * 100;      // mensal -> anual
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tempoTxt = m => {
  const a = Math.floor(m/12), r = m % 12;
  const pa = a ? a + (a === 1 ? ' ano' : ' anos') : '';
  const pm = r ? r + (r === 1 ? ' mês' : ' meses') : '';
  return [pa, pm].filter(Boolean).join(' e ') || '0 meses';
};
const irAliquota = dias => dias <= 180 ? 22.5 : dias <= 360 ? 20 : dias <= 720 ? 17.5 : 15;
const price = (pv, i, n) => i === 0 ? pv/n : pv * i / (1 - Math.pow(1+i, -n));

menu.addEventListener('keydown', e => {
  const i = tabs.indexOf(document.activeElement); if (i < 0) return;
  let j = null;
  if (e.key === 'ArrowRight') j = (i+1) % tabs.length;
  if (e.key === 'ArrowLeft')  j = (i-1+tabs.length) % tabs.length;
  if (e.key === 'Home') j = 0;

CALCS.forEach(c=>{ state[c.id] = {}; c.fields.forEach(f=>{ state[c.id][f.k] = f.v; if (f.unit) state[c.id][f.k+'_unit'] = f.unit[0]; }); });
let current = null;

const fmtField = (f, v) => f.t==='money' ? num(v,0) : f.t==='pct' ? num(v, f.step<.1?2:(f.step<1?1:0)) : String(v);
const parseField = (f, s) => {
  if (f.t==='money') return Number(String(s).replace(/\D/g,'')) || 0;
  const n = parseFloat(String(s).replace(/\./g,'').replace(',','.'));
  return isFinite(n) ? n : 0;
};
const clampOne = (f, x) => {
  if (!['money','pct','int'].includes(f.t)) return x;
  const hi = f.t==='money' ? 1e11 : f.t==='int' ? f.max : f.max*2;
  let v = Math.min(hi, Math.max(f.min, Number(x) || 0));
  return f.t==='int' ? Math.round(v) : v;
};
const clampAll = (c, raw) => { const v = {...raw}; c.fields.forEach(f=>{ v[f.k] = clampOne(f, v[f.k]); }); return v; };
const fillRange = r => { const p = (r.value - r.min)/(r.max - r.min)*100; r.style.setProperty('--p', Math.max(0,Math.min(100,p))+'%'); };

function fieldHTML(c, f){
  const v = state[c.id][f.k], id = `f-${c.id}-${f.k}`;
  if (f.t==='select') return `<div class="field"><label for="${id}">${f.label}</label><div class="inp"><select id="${id}" data-k="${f.k}">${f.opts.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>`;
  if (f.t==='seg') return `<div class="field" role="group" aria-labelledby="${id}-l"><label id="${id}-l">${f.label}</label><div class="seg" data-k="${f.k}">${f.opts.map(o=>`<button type="button" aria-pressed="${o===v}" data-v="${o}">${o}</button>`).join('')}</div></div>`;
  const pre = f.t==='money' ? '<span class="ad" aria-hidden="true">R$</span>' : '';
  let suf = f.suf ? `<span class="ad">${f.suf}</span>` : (f.t==='pct' && !f.unit ? '<span class="ad">%</span>' : '');
  if (f.unit) suf = `<select class="unit-sel" data-unit="${f.k}" aria-label="Período da taxa">${f.unit.map(u=>`<option ${state[c.id][f.k+'_unit']===u?'selected':''}>${u}</option>`).join('')}</select>`;
  const slv = Math.min(f.max, Math.max(f.min, v));
  return `<div class="field">
    <label for="${id}">${f.label}</label>
    <div class="inp">${pre}<input id="${id}" data-k="${f.k}" inputmode="${f.t==='int'?'numeric':'decimal'}" autocomplete="off" enterkeyhint="done" value="${fmtField(f,v)}">${suf}</div>
    <input type="range" data-r="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${slv}" aria-label="${f.label} (controle deslizante)" tabindex="-1">
  </div>`;
}

function select(id, animate){
  if (current === id) return;
  current = id;
  const c = CALCS.find(x=>x.id===id), idx = CALCS.indexOf(c), d = DISPLAY[id];
  tabs.forEach(b=>{ const on = b.dataset.id===id; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; if (on) b.scrollIntoView({inline:'center', block:'nearest', behavior: reduced||!animate ? 'auto':'smooth'}); });
  movePill(); setTimeout(fades, 350);
  try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#'+id); } catch(_){}
  document.title = c.name + ' · Calculadoras financeiras';
  const view = $('#view');
  view.setAttribute('aria-labelledby', 'tab-'+id);
  view.innerHTML = `
    <div class="${animate?'enter':''}">
      <div class="head">
        <span class="badge">${String(idx+1).padStart(2,'0')} / ${String(CALCS.length).padStart(2,'0')} · ${c.cat}</span>
        <span class="lead">${d.lead}</span>
        <h1 aria-label="${c.name}">${d.big.map(w=>`<span class="ln"><span>${w}</span></span>`).join('')}</h1>
        <p>${c.desc}</p>
      </div>
      <div class="body">
        <form class="card form" onsubmit="return false" aria-label="Dados da simulação">
          <span class="form-title">Seus números</span>
          ${c.fields.map(f=>fieldHTML(c,f)).join('')}
        </form>
        <div class="results" id="results"></div>
      </div>
    </div>`;
  view.querySelectorAll('input[type=range]').forEach(fillRange);
  bindForm(c, view.firstElementChild);
  compute(true);
}

function bindForm(c, view){
  const F = Object.fromEntries(c.fields.map(f=>[f.k,f]));
  const byK = k => view.querySelector(`input[data-k="${k}"]`);
  view.addEventListener('input', e=>{
    const t = e.target;
    if (t.dataset.r){
      const f = F[t.dataset.r]; state[c.id][f.k] = Number(t.value);
      byK(f.k).value = fmtField(f, Number(t.value)); fillRange(t); compute();
    } else if (t.dataset.k && t.tagName==='INPUT'){
      const f = F[t.dataset.k], val = parseField(f, t.value);
      state[c.id][f.k] = val;
      if (f.t==='money'){ const pos = t.value.length - t.selectionStart; t.value = val ? num(val,0) : ''; const np = Math.max(0, t.value.length - pos); t.setSelectionRange(np,np); }
      const r = view.querySelector(`[data-r="${f.k}"]`); if (r){ r.value = Math.min(f.max, Math.max(f.min, val)); fillRange(r); }
      compute();
    }
  });
  view.addEventListener('change', e=>{
    const t = e.target;
    if (t.tagName==='SELECT' && t.dataset.k){ state[c.id][t.dataset.k] = t.value; compute(); }
    if (t.dataset.unit){ state[c.id][t.dataset.unit+'_unit'] = t.value; compute(); }
    if (t.tagName==='INPUT' && t.dataset.k){ const f = F[t.dataset.k]; state[c.id][f.k] = clampOne(f, state[c.id][f.k]); t.value = fmtField(f, state[c.id][f.k]); compute(); }
  });
  view.addEventListener('focusin', e=>{ if (e.target.dataset.k && e.target.tagName==='INPUT') e.target.select(); });
  view.addEventListener('click', e=>{
    const b = e.target.closest('.seg button'); if(!b) return;
    const seg = b.parentElement; seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    state[c.id][seg.dataset.k] = b.dataset.v; compute();
  });
}

/* ---------- resultados ---------- */
let rafT, liveT, lastChartKey = '';
function compute(first){ cancelAnimationFrame(rafT); rafT = requestAnimationFrame(()=>renderResults(first)); }

function renderResults(first){
  const c = CALCS.find(x=>x.id===current), r = c.run(clampAll(c, state[c.id]));
  const box = $('#results');
  const shape = r.kpis.map(k=>k.l).join('|') + (r.chart?'c':'') + (r.bars?'b':'') + (r.progress?'p':'') + (r.table?'t':'');
  if (first || box.dataset.shape !== shape){
    box.dataset.shape = shape;
    box.innerHTML = `
      <div class="kpis">${r.kpis.map((k,i)=>`<div class="card kpi ${k.hero?'main':''}"><div><div class="l" data-l="${i}"></div><div class="v" data-v="${i}">–</div></div><div class="s" data-s="${i}"></div></div>`).join('')}</div>
      ${r.progress?'<div class="card box progress" id="prog"></div>':''}
      ${r.bars?'<div class="card box" id="barsBox"></div>':''}
      ${r.chart?'<div class="card box" id="chartBox"></div>':''}
      <div id="noteBox"></div>
      ${r.table?'<details class="more"><summary>Tabela ano a ano</summary><div class="tbl-wrap" id="tblBox"></div></details>':''}`;
    lastChartKey = '';
  }
  r.kpis.forEach((k,i)=>{
    box.querySelector(`[data-l="${i}"]`).textContent = k.l;
    box.querySelector(`[data-s="${i}"]`).innerHTML = k.s || '';
    tween(box.querySelector(`[data-v="${i}"]`), k.v, k.f);
  });
  if (r.progress) renderProgress(r.progress);
  if (r.bars) renderBars(r.bars);
  const cb = $('#chartBox');
  if (r.chart && cb) renderChart(cb, r.chart); else if (!r.chart && cb) cb.remove();
  $('#noteBox').innerHTML = r.note ? `<div class="note ${r.warn?'warn':''}">${r.note}</div>` : '';
  if (r.table) $('#tblBox').innerHTML = `<table><thead><tr>${r.table.head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${r.table.rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  clearTimeout(liveT);
  const h = r.kpis[0]; liveT = setTimeout(()=>{ $('#live').textContent = `${h.l}: ${h.f(h.v)}`; }, 700);
}

function tween(el, to, f){
  const from = parseFloat(el.dataset.n ?? 'NaN');
  el.dataset.n = to;
  if (!isFinite(from) || reduced || from === to){ el.textContent = f(to); return; }
  el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
  const t0 = performance.now(), d = 450;
  cancelAnimationFrame(el._raf);
  const step = now => {
    const p = Math.max(0, Math.min(1, (now-t0)/d)), e = 1 - Math.pow(1-p, 3);
    el.textContent = f(from + (to-from)*e);
    if (p < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

function renderProgress(p){
  const el = $('#prog'), C = 2*Math.PI*44;
  if (!el.firstChild) el.innerHTML = `<svg class="ring" viewBox="0 0 104 104" aria-hidden="true"><circle class="bgc" cx="52" cy="52" r="44"/><circle class="fg" cx="52" cy="52" r="44" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><text x="52" y="52">0%</text></svg><div><h3></h3><p></p></div>`;
  requestAnimationFrame(()=>{ el.querySelector('.fg').style.strokeDashoffset = C*(1-p.p/100); });
  el.querySelector('text').textContent = num(p.p,0)+'%';
  el.querySelector('h3').textContent = p.title;
  el.querySelector('p').textContent = p.text;
}

function renderBars(b){
  const el = $('#barsBox');
  const max = Math.max(...b.items.map(x=>x.value));
  const min = Math.min(b.base, ...b.items.map(x=>x.value)) * .96;
  const sorted = [...b.items].sort((a,c)=>c.value-a.value);
  if (!el.dataset.ready){
    el.dataset.ready = 1;
    el.innerHTML = `<div class="box-h"><h2>${b.title}</h2><div class="legend"><span><i style="background:var(--accent)"></i>Melhor opção</span><span><i style="background:var(--s2)"></i>Demais</span></div></div><div class="bars"></div>`;
  }
  const wrap = el.querySelector('.bars'), key = x => x.label.split(' ')[0];
  const prev = {}; wrap.querySelectorAll('.bar').forEach(x=>prev[x.dataset.k] = x.querySelector('.fl').style.width);
  wrap.innerHTML = sorted.map(x=>`<div class="bar ${x.best?'best':''}" data-k="${key(x)}"><div class="bl"><span>${x.label}${x.best?'<span class="tag">melhor</span>':''}</span><b>${brl(x.value)}</b></div><div class="tr"><div class="fl" style="width:${prev[key(x)]||'0%'}">+${num((x.value-b.base)/b.base*100,1)}%</div></div></div>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    wrap.querySelectorAll('.bar').forEach((bar,i)=>{ const v = sorted[i].value; bar.querySelector('.fl').style.width = (14 + 86*(v-min)/(max-min||1))+'%'; });
  }));
}

/* ---------- gráfico SVG ---------- */
function renderChart(el, ch){
  const W = 640, H = 290, L = 66, R = 14, T = 18, B = 30;
  const all = ch.series.flatMap(s=>s.values).concat(ch.ref ? [ch.ref.value] : []);
  const ymaxRaw = Math.max(...all, 1) * 1.08;
  const mag = Math.pow(10, Math.floor(Math.log10(ymaxRaw))), stepY = [1,2,2.5,5,10].map(x=>x*mag/4).find(s=>ymaxRaw/s <= 5) || mag;
  const ymax = Math.ceil(ymaxRaw/stepY)*stepY;
  const n = ch.x.length, X = i => L + (n<=1 ? 0 : i*(W-L-R)/(n-1)), Y = v => T + (H-T-B)*(1 - v/ymax);
  const key = ch.title + ch.series.map(s=>s.name).join() + n;
  const isNew = key !== lastChartKey; lastChartKey = key;
  const ticks = []; for (let v=0; v<=ymax+1e-9; v+=stepY) ticks.push(v);
  const every = Math.ceil(n/8);
  const pathOf = vals => vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const areaOf = vals => pathOf(vals) + `L${X(n-1).toFixed(1)},${Y(0)}L${X(0)},${Y(0)}Z`;
  const uid = 'g' + Math.random().toString(36).slice(2,7);
  const anim = isNew && !reduced;
  el.innerHTML = `
    <div class="box-h"><h2>${ch.title}</h2><div class="legend">${ch.series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}${ch.ref?`<span><i class="dash"></i>${ch.ref.label}</span>`:''}</div></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico: ${ch.title}">
      <defs>${ch.series.map((s,i)=>`<linearGradient id="${uid}${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${s.color};stop-opacity:.28"/><stop offset="1" style="stop-color:${s.color};stop-opacity:0"/></linearGradient>`).join('')}
      <clipPath id="${uid}c"><rect x="0" y="0" width="${anim?0:W}" height="${H}"/></clipPath></defs>
      <g class="grid">${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>
      <g class="axis">${ticks.map(v=>`<text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${compact(v)}</text>`).join('')}
        ${ch.x.map((x,i)=> (i%every===0||i===n-1) ? `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${x}</text>` : '').join('')}</g>
      <g clip-path="url(#${uid}c)">${ch.series.map((s,i)=>s.area?`<path d="${areaOf(s.values)}" fill="url(#${uid}${i})"/>`:'').join('')}</g>
      ${ch.series.map(s=>`<path class="ln ${anim?'anim':''}" pathLength="1" d="${pathOf(s.values)}" style="stroke:${s.color}"/>`).join('')}
      ${ch.ref?`<line class="ref" x1="${L}" x2="${W-R}" y1="${Y(ch.ref.value)}" y2="${Y(ch.ref.value)}"/><text class="ref-t" x="${W-R}" y="${Y(ch.ref.value)-6}" text-anchor="end">${ch.ref.label}</text>`:''}
      <line class="guide" x1="0" x2="0" y1="${T}" y2="${H-B}"/>
      <g>${ch.series.map(s=>`<circle class="dot" r="5" style="fill:${s.color};stroke:var(--card)" stroke-width="2" opacity="0"/>`).join('')}</g>
      <rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>
    </svg></div>
    <div class="tip" aria-hidden="true"></div>`;
  const svg = el.querySelector('svg'), clip = el.querySelector(`#${uid}c rect`);
  if (anim){
    const t0 = performance.now();
    const go = now => { const p = Math.max(0, Math.min(1,(now-t0)/900)), e = 1-Math.pow(1-p,3); clip.setAttribute('width', W*e); if (p<1) requestAnimationFrame(go); };
    requestAnimationFrame(go);
  }
  const tip = el.querySelector('.tip'), guide = svg.querySelector('.guide'), dots = svg.querySelectorAll('.dot');
  const move = e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(n-1, Math.round((p.x-L)/((W-L-R)/Math.max(1,n-1)))));
    guide.setAttribute('x1', X(i)); guide.setAttribute('x2', X(i)); guide.style.opacity = .45;
    ch.series.forEach((s,k)=>{ dots[k].setAttribute('cx', X(i)); dots[k].setAttribute('cy', Y(s.values[i])); dots[k].setAttribute('opacity',1); });
    tip.innerHTML = `<b>${ch.xl} ${ch.x[i]}</b>` + ch.series.map(s=>`<div><span><i style="background:${s.color}"></i>${s.name}</span><strong>${brl0(s.values[i])}</strong></div>`).join('');
    const box = el.getBoundingClientRect(), sb = svg.getBoundingClientRect();
    let left = sb.left - box.left + X(i)/W*sb.width + 14;
    if (left + 200 > box.width) left -= 200 + 28;
    tip.style.left = Math.max(8,left)+'px'; tip.style.top = (sb.top - box.top + 16)+'px';
    tip.classList.add('show');
  };
  const out = () => { tip.classList.remove('show'); guide.style.opacity = 0; dots.forEach(d=>d.setAttribute('opacity',0)); };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', out);
}

/* ---------- tema ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('calc-theme'); if (t) root.dataset.theme = t; } catch(_){}
$('#themeBtn').addEventListener('click', ()=>{
  const isDark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = isDark ? 'light' : 'dark';
  try { localStorage.setItem('calc-theme', root.dataset.theme); } catch(_){}
  lastChartKey = 'x'; compute();
});

/* ---------- início ---------- */
const fromHash = () => { let h = ''; try { h = location.hash.slice(1); } catch(_){} return CALCS.some(c=>c.id===h) ? h : null; };
addEventListener('hashchange', ()=>{ const h = fromHash(); if (h) select(h, true); });
select(fromHash() || 'juros', false);
document.fonts && document.fonts.ready.then(()=>{ movePill(); fades(); });
})();
</script>
</body>
</html>
